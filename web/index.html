<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Filter</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; background: #fafafa; color: #222; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    input, button { font: inherit; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; }
    input { flex: 1; min-width: 0; }
    button { background: #222; color: #fff; border-color: #222; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }
    #log { height: 360px; overflow-y: auto; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; }
    .msg { padding: 3px 0; }
    .user { font-weight: 600; margin-right: 6px; }
    .sys { color: #888; font-style: italic; }
    #status { font-size: 14px; color: #888; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h2>Chat Filter</h2>

  <div class="row">
    <input id="room" placeholder="room" value="stream123">
    <input id="user" placeholder="your name">
    <button id="connect">Join</button>
  </div>
  <div id="status">not connected</div>

  <div id="log"></div>

  <form class="row" id="form">
    <input id="text" placeholder="say something..." autocomplete="off" disabled>
    <button id="send" disabled>Send</button>
  </form>

  <script>
    const $ = id => document.getElementById(id);
    $("user").value = "user" + Math.floor(Math.random() * 1000);
    let ws;

    function line(html, cls = "msg") {
      const div = document.createElement("div");
      div.className = cls;
      div.innerHTML = html;
      $("log").appendChild(div);
      $("log").scrollTop = $("log").scrollHeight;
    }

    function esc(s) {
      return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function setConnected(on) {
      $("text").disabled = $("send").disabled = !on;
      $("room").disabled = $("user").disabled = on;
      $("connect").textContent = on ? "Leave" : "Join";
    }

    $("connect").onclick = () => {
      if (ws) { ws.close(); return; }
      const room = encodeURIComponent($("room").value.trim() || "lobby");
      const user = encodeURIComponent($("user").value.trim() || "anon");
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws?room=${room}&user=${user}`);

      ws.onopen = () => {
        setConnected(true);
        $("status").textContent = `connected to room "${decodeURIComponent(room)}"`;
        $("text").focus();
      };
      ws.onmessage = e => {
        const m = JSON.parse(e.data);
        line(`<span class="user">${esc(m.user)}:</span>${esc(m.text)}`);
      };
      ws.onclose = () => {
        setConnected(false);
        $("status").textContent = "not connected";
        line("disconnected", "sys");
        ws = null;
      };
    };

    $("form").onsubmit = e => {
      e.preventDefault();
      const text = $("text").value.trim();
      if (!text || !ws) return;
      ws.send(JSON.stringify({ text }));
      $("text").value = "";
    };
  </script>
</body>
</html>
